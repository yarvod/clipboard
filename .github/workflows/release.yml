name: build-and-release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    name: Build macOS app (universal)
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set VERSION from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: echo "${GITHUB_REF_NAME#v}" > VERSION

      - name: Build (arm64 + x86_64)
        run: ARCHS="arm64 x86_64" ./build.sh

      - name: Zip app bundle
        id: zip
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME:-dev}"
          mkdir -p release
          OUT_ZIP="release/ClipboardCommander-${VERSION}-macos-universal.zip"
          ditto -c -k --sequesterRsrc --keepParent dist/ClipboardCommander.app "$OUT_ZIP"
          echo "zip_path=$OUT_ZIP" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-universal
          path: ${{ steps.zip.outputs.zip_path }}
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: [build]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
